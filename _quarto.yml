project:
  type: website
  output-dir: docs
  preview:
    port: 5896
    browser: true
  render:
    - "index.qmd"
    - "intro.qmd"
    - "info_docenti.qmd"
    - "programma.qmd"
    - "approfondimenti.qmd"
    - "domande_frequenti.qmd"
    - "404.qmd"
  resources:
    - "images/"
    - "materials/"
    - "content/"
    - "static/"
    - "logo.jpeg"
    - "ILTK-Logo.jpg"
    - "robots.txt"

lang: it

website:
  title: "Meditazione, Compassione e Gestione Emozionale"
  description: "Corso di Perfezionamento Post-Laurea per le professioni di aiuto, organizzato dall'Università degli Studi di Firenze e dall'Istituto Lama Tzong Khapa."
  site-url: "https://ccaudek.github.io/compassion/"
  image: "logo.jpeg"
  favicon: "images/favicon.ico"
  repo-url: "https://github.com/ccaudek/compassion"
  google-analytics: "G-K1F64JCQ7Q"
  search:
    location: navbar
    type: overlay
    limit: 12
    collapse-after: 3
  open-graph:
    locale: it_IT
    site-name: "Meditazione, Compassione e Gestione Emozionale"
  twitter-card:
    card-style: summary_large_image
  announcement:
    icon: calendar-check
    dismissable: true
    content: "**V edizione 2026/2027** · 25 posti · domande entro il 15 gennaio 2027"
    type: primary
    position: below-navbar
  navbar:
    title: "Meditazione e Compassione"
    pinned: true
    collapse-below: lg
    background: "#123f3c"
    foreground: light
    left:
      - text: "Home"
        href: index.qmd
      - text: "Il corso"
        href: intro.qmd
      - text: "Programma"
        href: programma.qmd
      - text: "Docenti"
        href: info_docenti.qmd
      - text: "Risorse"
        menu:
          - text: "Approfondimenti"
            href: approfondimenti.qmd
          - text: "Domande frequenti"
            href: domande_frequenti.qmd
    tools:
      - icon: facebook
        href: "https://www.facebook.com/profile.php?id=100076063716374"
        aria-label: "Pagina Facebook del corso"
      - icon: instagram
        href: "https://www.instagram.com/mindfulness_method"
        aria-label: "Profilo Instagram del corso"
      - icon: linkedin
        href: "https://www.linkedin.com/in/meditazione-compassione-e-gestione-emozionale-per-le-professioni-di-aiuto-04a972214/"
        aria-label: "Profilo LinkedIn del corso"
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    border: true
    left: |
      **Corso di Perfezionamento Post-Laurea**  
      Università degli Studi di Firenze · Istituto Lama Tzong Khapa
    center: |
      [perfezionamento.meditazione@dss.unifi.it](mailto:perfezionamento.meditazione@dss.unifi.it)
    right:
      - text: "© 2026 Corrado Caudek"
      - icon: github
        href: "https://github.com/ccaudek/compassion"
        aria-label: "Codice sorgente su GitHub"

format:
  html:
    theme:
      light: [flatly, theme.scss]
      dark: [darkly, theme-dark.scss]
    toc: true
    toc-location: right
    toc-title: "In questa pagina"
    toc-depth: 3
    smooth-scroll: true
    respect-user-color-scheme: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    code-copy: false
    code-fold: false
    lightbox: true
    grid:
      body-width: 860px
      margin-width: 280px
      gutter-width: 2.5rem

execute:
  echo: false
  warning: false
  message: false
